<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>まるかいてポン</title>
<meta name="description" content="黒板にまるをかくと、なにかがうまれる。10かいで いくら かせげるかな？">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* 黒板とチョークの世界。床は粉受け(チョーク置き)。主役は盤面、UIは上下の細い帯だけ。 */
  --board:#1d4a38;
  --board-deep:#153729;
  --chalk:#f4f1e4;
  --chalk-dim:#b9c9bd;
  --yellow:#ffd84a;
  --pink:#ff9db0;
  --wood:#a9743f;
  --wood-dark:#7a4f27;
  --font-display:"Yusei Magic","Hiragino Maru Gothic ProN","Zen Maru Gothic",sans-serif;
  --font-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--board-deep);color:var(--chalk);font-family:var(--font-body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:
  radial-gradient(120% 80% at 30% 20%,rgba(255,255,255,.06),transparent 60%),
  radial-gradient(90% 70% at 80% 90%,rgba(0,0,0,.18),transparent 60%),
  var(--board)}
#hud{flex:none;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;position:relative;z-index:3;pointer-events:none}
#left{font-family:var(--font-display);font-size:15px;color:var(--chalk-dim);line-height:1.1;min-width:64px}
#left b{display:block;font-size:26px;color:var(--chalk);font-weight:400}
#totalBox{flex:1;text-align:center;min-width:0}
#totalBox small{display:block;font-size:11px;letter-spacing:.2em;color:var(--chalk-dim)}
#total{font-family:var(--font-display);font-size:clamp(22px,7.4vw,34px);color:var(--yellow);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tools{display:flex;gap:6px;pointer-events:auto}
.icon{width:44px;height:44px;border-radius:50%;border:2px solid rgba(244,241,228,.45);background:rgba(0,0,0,.18);color:var(--chalk);font-size:19px;display:grid;place-items:center;font-family:inherit}
.icon:focus-visible,.btn:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
#stage{flex:1;position:relative;min-height:0}
#c{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hint{position:absolute;left:16px;right:16px;top:34%;text-align:center;pointer-events:none;font-family:var(--font-display);color:var(--chalk);transition:opacity .4s}
#hint .big{font-size:clamp(24px,7.5vw,34px)}
#hint .sub{margin-top:10px;font-size:14px;color:var(--chalk-dim);font-family:var(--font-body);font-weight:700;line-height:1.7}
#hint.off{opacity:0}
#tray{flex:none;height:calc(18px + env(safe-area-inset-bottom));background:linear-gradient(var(--wood),var(--wood-dark));border-top:3px solid #c98f55;box-shadow:0 -6px 12px rgba(0,0,0,.25);position:relative;z-index:2}
.overlay{position:absolute;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:calc(env(safe-area-inset-top) + 20px) 22px calc(env(safe-area-inset-bottom) + 20px);background:rgba(21,55,41,.95);text-align:center;overflow-y:auto}
.overlay.on{display:flex}
h1{font-family:var(--font-display);font-weight:400;font-size:clamp(40px,13vw,64px);line-height:1.05;color:var(--chalk);text-wrap:balance}
h1 span{color:var(--yellow)}
.ring{width:96px;height:96px;border-radius:50%;border:7px solid var(--chalk);border-left-color:var(--yellow);transform:rotate(-18deg);opacity:.95}
.lead{font-size:16px;font-weight:700;line-height:1.8;max-width:22em}
.rules{list-style:none;display:grid;gap:6px;font-size:14px;font-weight:700;color:var(--chalk-dim);text-align:left}
.rules b{color:var(--yellow);font-family:var(--font-display);font-weight:400;margin-right:6px}
.btn{font-family:var(--font-display);font-size:22px;min-height:56px;padding:10px 30px;border-radius:999px;border:3px solid var(--chalk);background:var(--yellow);color:#2a2413;box-shadow:0 5px 0 rgba(0,0,0,.3)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.btn.ghost{background:transparent;color:var(--chalk);font-size:17px;min-height:48px;padding:8px 20px;border-width:2px;box-shadow:none;text-decoration:none;display:inline-grid;place-items:center}
[hidden]{display:none!important}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.best{font-size:13px;color:var(--chalk-dim);font-weight:700}
#rTitle{font-family:var(--font-display);font-size:clamp(26px,8vw,36px);color:var(--pink)}
#rTotal{font-family:var(--font-display);font-size:clamp(30px,10vw,48px);color:var(--yellow);line-height:1.15;word-break:break-all}
#rNew{font-family:var(--font-display);color:var(--pink);font-size:18px;min-height:1.4em}
#rGot{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:320px}
#rGot img{width:44px;height:44px}
#zukan{justify-content:flex-start}
#zHead{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:520px;flex:none}
#zHead h2{font-family:var(--font-display);font-weight:400;font-size:26px}
#zCount{color:var(--yellow);font-family:var(--font-display);margin-left:10px;font-size:18px}
#zBody{width:100%;max-width:520px;display:grid;gap:14px;padding-bottom:10px}
#zBody h3{font-size:13px;letter-spacing:.15em;color:var(--chalk-dim);text-align:left;border-bottom:2px dashed rgba(244,241,228,.3);padding-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{background:var(--board);border:2px solid rgba(244,241,228,.25);border-radius:14px;padding:8px 4px 10px;display:grid;justify-items:center;gap:2px;min-height:118px;align-content:center}
.card img{width:56px;height:56px}
.card .n{font-size:12px;font-weight:700;line-height:1.3}
.card .p{font-size:12px;color:var(--yellow);font-family:var(--font-display)}
.card.no{opacity:.55}
.card.no .q{font-family:var(--font-display);font-size:40px;color:var(--chalk-dim);height:56px;line-height:56px}
@media (prefers-reduced-motion:reduce){#hint{transition:none}}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div id="left">のこり<b id="leftN">10</b></div>
    <div id="totalBox"><small>ごうけい</small><div id="total">0円</div></div>
    <div id="tools">
      <button class="icon" id="bSound" type="button" aria-label="おとを きりかえる">🔊</button>
      <button class="icon" id="bZukan" type="button" aria-label="ずかんを ひらく">📖</button>
    </div>
  </div>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="hint" class="off">
      <div class="big">ゆびで まるを かこう</div>
      <div class="sub">ちいさい まる、おおきい まるで<br>でてくる ものが かわるよ</div>
    </div>
  </div>
  <div id="tray"></div>

  <section class="overlay on" id="title">
    <div class="ring" aria-hidden="true"></div>
    <h1>まるかいて<br><span>ポン！</span></h1>
    <p class="lead">黒板に まるを かくと、<br>なにかが うまれる。</p>
    <ul class="rules">
      <li><b>1</b>ゆびで まるを かく（10かい）</li>
      <li><b>2</b>きれいな まるほど たかい ものが でる</li>
      <li><b>3</b>かんぺきな まるは…？</li>
    </ul>
    <button class="btn" id="bStart" type="button">はじめる</button>
    <p class="best" id="tBest"></p>
    <a class="btn ghost home" href="./" hidden>ほかの ゲーム ▶</a>
  </section>

  <section class="overlay" id="result">
    <div id="rNew"></div>
    <div id="rTitle"></div>
    <div id="rTotal"></div>
    <div id="rGot"></div>
    <p class="best" id="rBest"></p>
    <button class="btn" id="bAgain" type="button">もう1かい</button>
    <div class="row">
      <button class="btn ghost" id="bZukan2" type="button">📖 ずかん</button>
      <a class="btn ghost" id="aShare" target="_blank" rel="noopener" href="https://twitter.com/intent/tweet">𝕏 でシェア</a>
    </div>
    <p class="best" id="rTip" hidden>文は コピーされるよ。Xで「ペースト」してね</p>
    <a class="btn ghost home" href="./" hidden>ほかの ゲーム ▶</a>
  </section>

  <section class="overlay" id="zukan">
    <div id="zHead">
      <h2>ずかん<span id="zCount"></span></h2>
      <button class="btn ghost" id="bZClose" type="button">とじる ✕</button>
    </div>
    <div id="zBody"></div>
  </section>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const BOARD = '#1d4a38';
const FONT_D = '"Yusei Magic","Hiragino Maru Gothic ProN","Zen Maru Gothic",sans-serif';
const FONT_E = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- でてくるもの ---------- */
const coin = (fill, rim, o = {}) => Object.assign({ fill, rim }, o);
const E = (id, name, price, emoji) => ({ id, name, price, emoji });
/* まるの大きさ(small/mid/big) × まる度のランク(0〜5)。同じランクの中からランダムに1つ出る。 */
const TABLE = {
  small: [
    [ { id: 'yen1', name: 'まがった1円玉', price: 1n, coin: coin('#dfe4e8', '#8f99a3', { label: '1', bent: true }) },
      E('bubble', 'しゃぼん玉', 0n, '🫧'), E('naruto', 'なると', 15n, '🍥'),
      E('stone', 'ただの石', 0n, '🪨'), E('tooth', 'ぬけた歯', 2n, '🦷') ],
    [ { id: 'yen5', name: '5円玉', price: 5n, coin: coin('#e0b84c', '#94731c', { hole: true }) },
      E('candy', 'あめ玉', 10n, '🍬'), E('berry', 'ブルーベリー', 20n, '🫐') ],
    [ { id: 'yen50', name: '50円玉', price: 50n, coin: coin('#d9dee3', '#858f99', { hole: true }) },
      E('egg', 'たまご', 30n, '🥚'), E('senbei', 'せんべい', 40n, '🍘') ],
    [ { id: 'yen100', name: '100円玉', price: 100n, coin: coin('#d9dee3', '#7d8791', { label: '100' }) },
      E('cookie', 'クッキー', 80n, '🍪'), E('yoyo', 'ヨーヨー', 700n, '🪀') ],
    [ { id: 'yen500', name: '500円玉', price: 500n, coin: coin('#e6cb6e', '#8f7424', { label: '500', inner: '#dde2e6' }) },
      E('baseball', 'やきゅうボール', 800n, '⚾'), E('ring', 'ゆびわ', 300000n, '💍') ],
    [ E('medal', '金メダル', 1000000n, '🥇'), E('goldcoin', 'むかしの金貨', 2000000n, '🪙') ]
  ],
  mid: [
    [ E('potato', 'じゃがいも', 30n, '🥔'), E('onion', 'たまねぎ', 60n, '🧅'),
      E('sock', 'かたっぽ靴下', 3n, '🧦'), E('banana', 'バナナの皮', 1n, '🍌') ],
    [ E('donut', 'ドーナツ', 150n, '🍩'), E('mikan', 'みかん', 50n, '🍊'), E('burger', 'ハンバーガー', 450n, '🍔') ],
    [ E('ball', 'ボール', 1000n, '⚽'), E('pancake', 'ホットケーキ', 600n, '🥞'), E('frisbee', 'フリスビー', 1200n, '🥏') ],
    [ E('pizza', 'ピザ', 2000n, '🍕'), E('suika', 'すいか', 2500n, '🍉'), E('basket', 'バスケットボール', 4000n, '🏀') ],
    [ E('bowl', 'ボウリングの球', 15000n, '🎳'), E('mirror', 'ミラーボール', 20000n, '🪩'), E('taiko', 'たいこ', 30000n, '🥁') ],
    [ E('crystal', '水晶玉', 3000000n, '🔮'), E('ufo', 'UFO', 50000000n, '🛸') ]
  ],
  big: [
    [ E('onigiri', 'つぶれたおにぎり', 120n, '🍙'), E('balloon', 'しぼんだ風船', 10n, '🎈'),
      E('kettle', 'へこんだやかん', 20n, '🫖'), E('can', 'あきかん', 2n, '🥫'), E('paper', 'ペーパーのしん', 4n, '🧻'), E('web', 'くもの巣', 0n, '🕸️') ],
    [ E('tire', 'タイヤ', 8000n, '🛞'), E('pumpkin', 'かぼちゃ', 800n, '🎃'), E('ukiwa', 'うきわ', 1500n, '🛟') ],
    [ E('wheel', '観覧車', 3000000000n, '🎡'), E('stadium', 'スタジアム', 100000000000n, '🏟️') ],
    [ E('moon', '月', 500n * 10n ** 12n, '🌕'), E('comet', 'すい星', 100n * 10n ** 12n, '☄️') ],
    [ E('earth', '地球', 5n * 10n ** 16n, '🌍'), E('saturn', '土星', 8n * 10n ** 16n, '🪐') ],
    [ E('sun', '太陽', 10n ** 20n, '☀️'), E('sunface', 'わらう太陽', 2n * 10n ** 20n, '🌞') ]
  ]
};
/* げきレア: まるの大きさも出来も関係なく、1%で出る */
const RARE_RATE = 0.01;
const RARE = [
  E('hiyoko', 'ひよこ', 7777n, '🐥'), E('neko', 'まんまるねこ', 77777n, '🐱'), E('fugu', 'ふぐ', 777777n, '🐡'),
  E('panda', 'パンダ', 7777777n, '🐼'), E('alien', 'うちゅうじん', 77777777n, '👽')
];
const BH = { id: 'bh', name: 'ブラックホール', price: null, bh: true };
const GROUPS = [['small', 'ちいさい まる'], ['mid', 'ふつうの まる'], ['big', 'おおきい まる']];
const ALL = [...TABLE.small.flat(), ...TABLE.mid.flat(), ...TABLE.big.flat(), ...RARE, BH];

/* ---------- お金の表示 ---------- */
const UNITS = [['垓', 10n ** 20n], ['京', 10n ** 16n], ['兆', 10n ** 12n], ['億', 10n ** 8n], ['万', 10n ** 4n]];
function fmt(n) {
  if (n < 10000n) return n.toLocaleString('ja-JP') + '円';
  const parts = [];
  let rem = n;
  for (const [name, u] of UNITS) {
    const q = rem / u;
    if (q > 0n) { parts.push(q.toLocaleString('ja-JP') + name); rem %= u; }
  }
  if (rem > 0n) parts.push(rem.toLocaleString('ja-JP'));
  return parts.slice(0, 2).join('') + '円';
}
function titleFor(n) {
  if (n < 1000n) return 'まるの みならい';
  if (n < 100000n) return 'こづかい めいじん';
  if (n < 10n ** 8n) return 'まる長者';
  if (n < 10n ** 12n) return 'まる大富豪';
  if (n < 10n ** 16n) return '月の もちぬし';
  if (n < 10n ** 20n) return '地球の もちぬし';
  return '宇宙の しはいしゃ';
}

/*EVAL-START*/
/* ---------- まるの判定 ---------- */
function resample(pts, n) {
  const d = [0];
  for (let i = 1; i < pts.length; i++) d.push(d[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
  const total = d[d.length - 1];
  const out = [];
  let j = 1;
  for (let k = 0; k < n; k++) {
    const t = total * k / (n - 1);
    while (j < pts.length - 1 && d[j] < t) j++;
    const seg = d[j] - d[j - 1] || 1;
    const f = (t - d[j - 1]) / seg;
    out.push({ x: pts[j - 1].x + (pts[j].x - pts[j - 1].x) * f, y: pts[j - 1].y + (pts[j].y - pts[j - 1].y) * f });
  }
  return { pts: out, length: total };
}
function evaluate(raw, minDim) {
  if (raw.length < 6) return null;
  const { pts, length } = resample(raw, 72);
  if (length < 50) return null;
  let cx = 0, cy = 0;
  for (const p of pts) { cx += p.x; cy += p.y; }
  cx /= pts.length; cy /= pts.length;
  let R = 0;
  const rs = pts.map(p => Math.hypot(p.x - cx, p.y - cy));
  for (const r of rs) R += r;
  R /= rs.length;
  if (R < 10) return null;
  let v = 0;
  for (const r of rs) v += (r - R) * (r - R);
  const cv = Math.sqrt(v / rs.length) / R;
  const gap = Math.hypot(pts[0].x - pts[pts.length - 1].x, pts[0].y - pts[pts.length - 1].y) / R;
  let sweep = 0;
  for (let i = 1; i < pts.length; i++) {
    let a = Math.atan2(pts[i].y - cy, pts[i].x - cx) - Math.atan2(pts[i - 1].y - cy, pts[i - 1].x - cx);
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    sweep += a;
  }
  const cover = Math.abs(sweep) / (Math.PI * 2);
  let score = 100 * (1 - 2.6 * cv);
  score -= Math.max(0, gap - 0.2) * 22;
  score -= Math.max(0, 0.93 - cover) * 120;
  score -= Math.max(0, cover - 1.2) * 60;
  score = Math.max(0, Math.min(100, Math.round(score)));
  const rel = R / minDim;
  const size = rel < 0.115 ? 'small' : rel < 0.26 ? 'mid' : 'big';
  return { cx, cy, R, score, size };
}
function rankOf(score) {
  return score >= 90 ? 5 : score >= 82 ? 4 : score >= 72 ? 3 : score >= 60 ? 2 : score >= 45 ? 1 : 0;
}
/*EVAL-END*/

/* ---------- 絵 ---------- */
function drawCoin(g, r, c) {
  g.save();
  if (c.bent) { g.rotate(-0.3); g.scale(1, 0.68); }
  g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fillStyle = c.fill; g.fill();
  g.lineWidth = Math.max(1.5, r * 0.09); g.strokeStyle = c.rim; g.stroke();
  if (c.inner) { g.beginPath(); g.arc(0, 0, r * 0.66, 0, TAU); g.fillStyle = c.inner; g.fill(); }
  g.beginPath(); g.arc(0, 0, r * 0.8, 0, TAU); g.lineWidth = Math.max(1, r * 0.04); g.stroke();
  if (c.hole) {
    g.beginPath(); g.arc(0, 0, r * 0.25, 0, TAU); g.fillStyle = BOARD; g.fill();
    g.lineWidth = Math.max(1, r * 0.07); g.stroke();
  }
  if (c.label) {
    g.fillStyle = c.rim; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = `900 ${r * (c.label.length > 2 ? 0.6 : 1)}px sans-serif`;
    g.fillText(c.label, 0, r * 0.05);
  }
  if (c.bent) { g.beginPath(); g.moveTo(-r * 0.2, -r); g.lineTo(r * 0.15, r); g.lineWidth = Math.max(1, r * 0.07); g.stroke(); }
  g.restore();
}
function drawHole(g, r, t) {
  g.save();
  const glow = g.createRadialGradient(0, 0, r * 0.7, 0, 0, r * 2);
  glow.addColorStop(0, 'rgba(255,170,70,.75)');
  glow.addColorStop(0.45, 'rgba(255,110,60,.28)');
  glow.addColorStop(1, 'rgba(255,110,60,0)');
  g.fillStyle = glow; g.beginPath(); g.arc(0, 0, r * 2, 0, TAU); g.fill();
  g.rotate(t * 2.4);
  for (let i = 0; i < 3; i++) {
    g.rotate(TAU / 3);
    g.beginPath(); g.ellipse(0, 0, r * 1.35, r * 0.42, 0, 0.25, Math.PI - 0.25);
    g.strokeStyle = i === 0 ? '#fff3c4' : '#ffb347'; g.lineWidth = Math.max(2, r * 0.1); g.lineCap = 'round'; g.stroke();
  }
  g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fillStyle = '#05060a'; g.fill();
  g.lineWidth = Math.max(1.5, r * 0.05); g.strokeStyle = '#ffe9a8'; g.stroke();
  g.restore();
}
function drawItem(g, item, r, t) {
  if (item.bh) return drawHole(g, r * 0.62, t || 0);
  if (item.coin) return drawCoin(g, r, item.coin);
  g.font = `${r * 1.8}px ${FONT_E}`;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(item.emoji, 0, r * 0.1);
}
const thumbs = {};
function thumb(item) {
  if (thumbs[item.id]) return thumbs[item.id];
  const o = document.createElement('canvas');
  o.width = o.height = 128;
  const g = o.getContext('2d');
  g.translate(64, 64);
  drawItem(g, item, 50, 0.4);
  return (thumbs[item.id] = o.toDataURL());
}

/* ---------- ほぞん（なくても あそべる） ---------- */
const KEY = 'marupon_v1';
let save = { best: '0', dex: [] };
try {
  const s = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (s && typeof s.best === 'string' && Array.isArray(s.dex)) save = s;
} catch (e) {}
function persist() { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} }
function best() { try { return BigInt(save.best); } catch (e) { return 0n; } }

/* ---------- おと ---------- */
let ac = null, muted = false;
function audioOn() {
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
  } catch (e) { ac = null; }
}
function tone(f, d, type, v, slide, delay) {
  if (muted || !ac) return;
  try {
    const t0 = ac.currentTime + (delay || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'triangle';
    o.frequency.setValueAtTime(f, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t0 + d);
    g.gain.setValueAtTime(v || 0.14, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + d);
    o.connect(g); g.connect(ac.destination);
    o.start(t0); o.stop(t0 + d + 0.02);
  } catch (e) {}
}
function popSound(rank) {
  if (rank === 0) { tone(220, 0.25, 'sawtooth', 0.08, 0.5); return; }
  const base = 330 * Math.pow(1.19, rank);
  tone(base, 0.16, 'triangle', 0.16, 1.5);
  if (rank >= 3) tone(base * 1.5, 0.22, 'triangle', 0.12, 1, 0.09);
  if (rank >= 5) tone(base * 2, 0.4, 'triangle', 0.12, 1, 0.18);
}

/* ---------- じょうたい ---------- */
const cv = $('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, floorY = 0;
let state = 'title';
let left = 10, total = 0n, shown = 0n, got = [];
let bodies = [], labels = [], dust = [], bh = null;
let stroke = null, ghost = null, shake = 0, time = 0;

function resize() {
  const r = cv.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = r.width; H = r.height;
  cv.width = Math.max(1, Math.round(W * DPR));
  cv.height = Math.max(1, Math.round(H * DPR));
  floorY = H - 2;
  for (const b of bodies) { b.x = Math.min(W - b.r, Math.max(b.r, b.x)); b.y = Math.min(floorY - b.r, b.y); }
}
window.addEventListener('resize', resize);

function setTotal() {
  const el = $('total');
  el.textContent = fmt(shown);
  el.style.fontSize = '';
  if (el.scrollWidth <= el.clientWidth) return;
  let fs = parseFloat(getComputedStyle(el).fontSize);
  while (el.scrollWidth > el.clientWidth && fs > 11) { fs -= 1; el.style.fontSize = fs + 'px'; }
}
function setHud() {
  $('leftN').textContent = left;
  setTotal();
}
function startGame() {
  audioOn();
  left = 10; total = 0n; shown = 0n; got = [];
  bodies = []; labels = []; dust = []; bh = null; stroke = null; ghost = null;
  state = 'play';
  for (const id of ['title', 'result', 'zukan']) $(id).classList.remove('on');
  $('hint').classList.remove('off');
  setHud();
  resize();
}

/* ---------- まるを かく ---------- */
function pos(e) {
  const r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
cv.addEventListener('pointerdown', e => {
  if (state !== 'play' || left <= 0 || stroke) return;
  e.preventDefault();
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  stroke = { id: e.pointerId, pts: [pos(e)] };
  $('hint').classList.add('off');
});
cv.addEventListener('pointermove', e => {
  if (!stroke || e.pointerId !== stroke.id) return;
  const p = pos(e), q = stroke.pts[stroke.pts.length - 1];
  if (Math.hypot(p.x - q.x, p.y - q.y) > 2.5) stroke.pts.push(p);
});
function endStroke(e) {
  if (!stroke || e.pointerId !== stroke.id) return;
  const pts = stroke.pts;
  stroke = null;
  ghost = { pts, t: 0 };
  if (state !== 'play') return;
  const ev = evaluate(pts, Math.min(W, H));
  if (!ev) { addLabel(W / 2, H * 0.4, ['もっと おおきく かいてね'], '', '#f4f1e4'); return; }
  left--;
  const perfect = ev.score >= 94 || (ev.score >= 88 && Math.random() < 0.03);
  if (perfect) startHole(ev);
  else spawn(ev);
  setHud();
}
cv.addEventListener('pointerup', endStroke);
cv.addEventListener('pointercancel', endStroke);

function addLabel(x, y, lines, sub, color) {
  labels.push({ x: Math.min(W - 110, Math.max(110, x)), y: Math.max(56, y), lines, sub, color, t: 0 });
}
function puff(x, y, n, color) {
  if (reduceMotion) return;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, s = 1 + Math.random() * 4;
    dust.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1, r: 2 + Math.random() * 3, t: 0, color });
  }
}
function record(item) {
  got.push(item);
  if (!save.dex.includes(item.id)) { save.dex.push(item.id); persist(); }
}
function finishIfDone(delay) {
  if (left <= 0) setTimeout(() => { if (state === 'play' && left <= 0) showResult(); }, delay);
}
function spawn(ev) {
  let rank = rankOf(ev.score), lucky = false;
  if (rank < 5 && Math.random() < 0.07) { rank++; lucky = true; }
  const rare = Math.random() < RARE_RATE;
  const pool = rare ? RARE : TABLE[ev.size][rank];
  const item = pool[Math.floor(Math.random() * pool.length)];
  const m = Math.min(W, H);
  const r = Math.max(17, Math.min(m * 0.14, ev.R * 0.55));
  const x = Math.min(W - r, Math.max(r, ev.cx)), y = Math.min(floorY - r, Math.max(r, ev.cy));
  bodies.push({ x, y, vx: (Math.random() - 0.5) * 1.2, vy: 0, r, rot: 0, item, age: 0, hold: 34, scale: 1 });
  total += item.price;
  record(item);
  const color = rare ? '#8fe6ff' : rank === 0 ? '#ff9db0' : rank >= 3 ? '#ffd84a' : '#f4f1e4';
  const note = rare ? '　げきレア！！' : lucky ? '　ラッキー！' : rank === 0 ? '　ハズレ！' : '';
  addLabel(x, y - r - 46, [item.name, fmt(item.price)], `まる度 ${ev.score}点${note}`, color);
  puff(x, y, rare ? 44 : 8 + rank * 5, rare ? '#8fe6ff' : rank >= 3 ? '#ffd84a' : '#f4f1e4');
  popSound(rare ? 5 : rank);
  finishIfDone(1900);
}
function startHole(ev) {
  state = 'busy';
  const R = Math.max(34, Math.min(Math.min(W, H) * 0.2, ev.R * 0.6));
  bh = { x: ev.cx, y: Math.min(floorY - R, Math.max(R + 40, ev.cy)), R, r: 0, t: 0, phase: 'grow', spin: 0 };
  record(BH);
  addLabel(bh.x, bh.y - R - 60, ['ブラックホール', 'ねだん：はかれない'], `まる度 ${ev.score}点　かんぺき！`, '#ffd84a');
  tone(180, 1.6, 'sawtooth', 0.12, 0.25);
  tone(90, 1.8, 'sine', 0.2, 0.5);
}

/* ---------- うごき ---------- */
function physics() {
  for (const b of bodies) {
    b.age++;
    if (b.hold > 0) { b.hold--; continue; }
    b.vy += 0.5; b.vx *= 0.995;
    b.x += b.vx; b.y += b.vy; b.rot += b.vx / b.r;
  }
  for (let k = 0; k < 4; k++) {
    for (let i = 0; i < bodies.length; i++) {
      const a = bodies[i];
      for (let j = i + 1; j < bodies.length; j++) {
        const b = bodies[j];
        const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.01, min = a.r + b.r;
        if (d >= min) continue;
        const nx = dx / d, ny = dy / d, ov = min - d;
        const ma = a.hold > 0 ? 1e9 : a.r * a.r, mb = b.hold > 0 ? 1e9 : b.r * b.r, t = ma + mb;
        a.x -= nx * ov * (mb / t); a.y -= ny * ov * (mb / t);
        b.x += nx * ov * (ma / t); b.y += ny * ov * (ma / t);
        const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (rv < 0) {
          const imp = -(1.15) * rv / (1 / ma + 1 / mb);
          a.vx -= imp / ma * nx; a.vy -= imp / ma * ny;
          b.vx += imp / mb * nx; b.vy += imp / mb * ny;
        }
      }
      if (a.x < a.r) { a.x = a.r; if (a.vx < 0) a.vx *= -0.3; }
      if (a.x > W - a.r) { a.x = W - a.r; if (a.vx > 0) a.vx *= -0.3; }
      if (a.y > floorY - a.r) {
        a.y = floorY - a.r;
        if (a.vy > 0) a.vy = a.vy > 1.2 ? a.vy * -0.22 : 0;
        a.vx *= 0.9;
      }
    }
  }
}
function holeStep(dt) {
  bh.t += dt; bh.spin += dt;
  if (bh.phase === 'grow') {
    const k = Math.min(1, bh.t / 0.5);
    bh.r = bh.R * (1 - Math.pow(1 - k, 3));
    if (k >= 1) { bh.phase = 'suck'; bh.t = 0; }
  } else if (bh.phase === 'suck') {
    shake = 5;
    for (let i = bodies.length - 1; i >= 0; i--) {
      const b = bodies[i];
      const dx = bh.x - b.x, dy = bh.y - b.y, d = Math.hypot(dx, dy) || 1;
      b.vx = (b.vx + dx / d * 1.5 - dy / d * 0.5) * 0.93;
      b.vy = (b.vy + dy / d * 1.5 + dx / d * 0.5) * 0.93;
      b.x += b.vx; b.y += b.vy; b.rot += 0.25;
      if (d < bh.r) { b.scale *= 0.84; if (b.scale < 0.12) bodies.splice(i, 1); }
    }
    if (bodies.length === 0 || bh.t > 3.2) {
      bodies = [];
      const doubled = total * 2n;
      total = doubled > total + 10000n ? doubled : total + 10000n;
      addLabel(W / 2, Math.max(90, bh.y - bh.R - 110), ['ぜんぶ すいこんで', 'ごうけい 2ばい！'], '', '#ffd84a');
      puff(bh.x, bh.y, 40, '#ffd84a');
      tone(523, 0.2, 'triangle', 0.16); tone(784, 0.3, 'triangle', 0.16, 1, 0.12); tone(1046, 0.5, 'triangle', 0.14, 1, 0.26);
      bh.phase = 'pay'; bh.t = 0;
    }
  } else if (bh.phase === 'pay') {
    if (bh.t > 1.2) { bh.phase = 'shrink'; bh.t = 0; }
  } else {
    bh.r = bh.R * Math.max(0, 1 - bh.t / 0.4);
    if (bh.t >= 0.4) { bh = null; state = 'play'; finishIfDone(900); }
  }
}

/* ---------- かく ---------- */
function drawPath(pts, alpha) {
  if (pts.length < 2) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = '#f4f1e4'; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.stroke();
  ctx.restore();
}
function popScale(age) {
  const k = Math.min(1, age / 16);
  return k >= 1 ? 1 : (1 - (1 - k) * (1 - k)) * (1 + 0.3 * Math.sin(k * Math.PI));
}
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (shake > 0 && !reduceMotion) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  if (bh) { ctx.save(); ctx.translate(bh.x, bh.y); drawHole(ctx, bh.r, bh.spin); ctx.restore(); }
  for (const b of bodies) {
    const s = Math.max(0.01, popScale(b.age)) * b.scale;
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot); ctx.scale(s, s);
    drawItem(ctx, b.item, b.r, 0);
    ctx.restore();
  }
  for (const d of dust) {
    ctx.globalAlpha = Math.max(0, 1 - d.t / 0.7);
    ctx.fillStyle = d.color; ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (ghost) drawPath(ghost.pts, Math.max(0, 1 - ghost.t / 0.35));
  if (stroke) drawPath(stroke.pts, 1);
  for (const l of labels) {
    const a = l.t < 0.15 ? l.t / 0.15 : Math.max(0, 1 - (l.t - 1.3) / 0.5);
    const y = l.y - Math.min(1, l.t / 0.3) * 12;
    ctx.save();
    ctx.globalAlpha = Math.min(1, a);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round'; ctx.strokeStyle = '#153729';
    let yy = y;
    l.lines.forEach((line, i) => {
      ctx.font = `${i === 0 && l.lines.length > 1 ? 20 : 26}px ${FONT_D}`;
      ctx.lineWidth = 7; ctx.strokeText(line, l.x, yy);
      ctx.fillStyle = l.color; ctx.fillText(line, l.x, yy);
      yy += 28;
    });
    if (l.sub) {
      ctx.font = `14px ${FONT_D}`;
      ctx.lineWidth = 5; ctx.strokeText(l.sub, l.x, yy - 2);
      ctx.fillStyle = '#b9c9bd'; ctx.fillText(l.sub, l.x, yy - 2);
    }
    ctx.restore();
  }
}

let last = 0, acc = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000 || 0);
  last = now; time += dt;
  acc += dt;
  let steps = 0;
  while (acc >= 1 / 60 && steps < 4) {
    acc -= 1 / 60; steps++;
    if (bh) holeStep(1 / 60); else physics();
    if (shake > 0) shake *= 0.85;
    if (shake < 0.3) shake = 0;
    for (const d of dust) { d.x += d.vx; d.y += d.vy; d.vy += 0.15; d.t += 1 / 60; }
  }
  if (acc > 0.2) acc = 0;
  dust = dust.filter(d => d.t < 0.7);
  for (const l of labels) l.t += dt;
  labels = labels.filter(l => l.t < 1.8);
  if (ghost) { ghost.t += dt; if (ghost.t > 0.35) ghost = null; }
  if (shown !== total) {
    const diff = total - shown;
    let step = diff / 5n;
    if (step === 0n) step = diff > 0n ? 1n : -1n;
    shown += step;
    setTotal();
  }
  render();
  requestAnimationFrame(frame);
}

/* ---------- シェア用の けっか画像 ---------- */
let shareFile = null, shareText = '';
function canShareFile() {
  try { return !!(shareFile && navigator.canShare && navigator.canShare({ files: [shareFile] })); } catch (e) { return false; }
}
function makeCard(ttl, record) {
  const S = 1200, c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  g.fillStyle = '#7a4f27'; g.fillRect(0, 0, S, S);
  g.fillStyle = BOARD; g.fillRect(26, 26, S - 52, S - 52);
  let sh = g.createRadialGradient(360, 240, 0, 360, 240, 900);
  sh.addColorStop(0, 'rgba(255,255,255,.08)'); sh.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = sh; g.fillRect(26, 26, S - 52, S - 52);
  sh = g.createRadialGradient(960, 1080, 0, 960, 1080, 800);
  sh.addColorStop(0, 'rgba(0,0,0,.2)'); sh.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = sh; g.fillRect(26, 26, S - 52, S - 52);
  const tray = g.createLinearGradient(0, S - 96, 0, S - 26);
  tray.addColorStop(0, '#a9743f'); tray.addColorStop(1, '#7a4f27');
  g.fillStyle = tray; g.fillRect(26, S - 96, S - 52, 70);
  g.fillStyle = '#c98f55'; g.fillRect(26, S - 96, S - 52, 6);

  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = '#f4f1e4'; g.font = `68px ${FONT_D}`;
  g.fillText('まるかいてポン', S / 2, 130);
  g.fillStyle = '#b9c9bd'; g.font = `36px ${FONT_D}`;
  g.fillText('まるを 10かい かいて かせいだ おかね', S / 2, 215);
  const money = fmt(total);
  let fs = 170;
  do { g.font = `${fs}px ${FONT_D}`; fs -= 6; } while (g.measureText(money).width > 1020 && fs > 40);
  g.fillStyle = '#ffd84a'; g.fillText(money, S / 2, 375);
  g.fillStyle = '#ff9db0'; g.font = `64px ${FONT_D}`;
  g.fillText('「' + ttl + '」', S / 2, 530);
  if (record) {
    g.save(); g.translate(1010, 120); g.rotate(0.2);
    g.font = `40px ${FONT_D}`; g.fillText('しんきろく！', 0, 0); g.restore();
  }
  got.forEach((it, i) => {
    g.save();
    g.translate(S / 2 + ((i % 5) - 2) * 196, 700 + Math.floor(i / 5) * 190);
    drawItem(g, it, 66, 0.4);
    g.restore();
  });
  g.fillStyle = '#b9c9bd'; g.font = `34px ${FONT_D}`;
  g.fillText('rockpoppo.github.io/games', S / 2, 1050);
  return c;
}

/* ---------- けっか・ずかん ---------- */
function showResult() {
  state = 'result';
  shown = total; setHud();
  const prev = best();
  const isNew = total > prev;
  if (isNew) { save.best = total.toString(); persist(); }
  const ttl = titleFor(total);
  $('rNew').textContent = isNew && prev > 0n ? 'しんきろく！' : '';
  $('rTitle').textContent = ttl;
  $('rTotal').textContent = fmt(total);
  $('rBest').textContent = 'じこベスト　' + fmt(best());
  const box = $('rGot'); box.textContent = '';
  for (const it of got) {
    const im = document.createElement('img');
    im.src = thumb(it); im.alt = it.name;
    box.appendChild(im);
  }
  const text = `まるをかいて ${fmt(total)} かせいだ！ 称号「${ttl}」 #まるかいてポン`;
  const url = location.href.split('#')[0];
  $('aShare').href = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(url);
  /* 画像を共有できる端末(iPhoneなど)では、けっか画像つきで共有する。できない端末は文字だけのXシェア。 */
  shareText = text + ' ' + url; shareFile = null;
  $('aShare').textContent = '𝕏 でシェア'; $('rTip').hidden = true;
  try {
    makeCard(ttl, isNew && prev > 0n).toBlob(b => {
      if (!b || state !== 'result') return;
      try { shareFile = new File([b], 'marupon.jpg', { type: 'image/jpeg' }); } catch (e) { shareFile = null; }
      if (canShareFile()) $('aShare').textContent = 'シェア';
    }, 'image/jpeg', 0.92);
  } catch (e) {}
  $('result').classList.add('on');
  if (isNew) { tone(659, 0.15); tone(880, 0.3, 'triangle', 0.14, 1, 0.12); }
}
function card(it) {
  const el = document.createElement('div');
  const has = save.dex.includes(it.id);
  el.className = 'card' + (has ? '' : ' no');
  if (has) {
    const im = document.createElement('img'); im.src = thumb(it); im.alt = '';
    const n = document.createElement('div'); n.className = 'n'; n.textContent = it.name;
    const p = document.createElement('div'); p.className = 'p'; p.textContent = it.price === null ? 'はかれない' : fmt(it.price);
    el.append(im, n, p);
  } else {
    const q = document.createElement('div'); q.className = 'q'; q.textContent = '？';
    const n = document.createElement('div'); n.className = 'n'; n.textContent = 'まだ みつけてない';
    el.append(q, n);
  }
  return el;
}
function showZukan() {
  const body = $('zBody'); body.textContent = '';
  const groups = GROUPS.map(([k, label]) => [label, TABLE[k].flat()]);
  groups.push(['げきレア', RARE]);
  groups.push(['とくべつ', [BH]]);
  for (const [label, items] of groups) {
    const h = document.createElement('h3'); h.textContent = label;
    const g = document.createElement('div'); g.className = 'grid';
    for (const it of items) g.appendChild(card(it));
    body.append(h, g);
  }
  $('zCount').textContent = `${ALL.filter(i => save.dex.includes(i.id)).length}/${ALL.length}`;
  $('zukan').classList.add('on');
  $('zukan').scrollTop = 0;
}

$('bStart').addEventListener('click', startGame);
$('bAgain').addEventListener('click', startGame);
$('bZukan').addEventListener('click', showZukan);
$('bZukan2').addEventListener('click', showZukan);
$('bZClose').addEventListener('click', () => $('zukan').classList.remove('on'));
$('aShare').addEventListener('click', e => {
  if (!canShareFile()) return;
  e.preventDefault();
  const href = $('aShare').href;
  try { navigator.clipboard.writeText(shareText).catch(() => {}); } catch (err) {}
  navigator.share({ files: [shareFile], text: shareText }).catch(err => {
    if (!err || err.name !== 'AbortError') location.href = href;
  });
});
$('bSound').addEventListener('click', () => {
  muted = !muted;
  $('bSound').textContent = muted ? '🔇' : '🔊';
  if (!muted) { audioOn(); tone(660, 0.1); }
});
document.addEventListener('gesturestart', e => e.preventDefault());

if (/\.github\.io$/.test(location.hostname)) document.querySelectorAll('.home').forEach(el => { el.hidden = false; });
const b0 = best();
$('tBest').textContent = b0 > 0n ? 'じこベスト　' + fmt(b0) : '';
resize();
requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
})();
</script>
