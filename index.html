<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ロックポッポのゲーム置き場</title>
<meta name="description" content="ブラウザですぐ遊べる、ちいさなゲーム置き場。登録もインストールもいりません。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 黒板の世界。1列のカード一覧、主役はゲームのカード。 */
  --board:#1d4a38;
  --board-deep:#153729;
  --chalk:#f4f1e4;
  --chalk-dim:#b9c9bd;
  --yellow:#ffd84a;
  --pink:#ff9db0;
  --font-display:"Yusei Magic","Hiragino Maru Gothic ProN","Zen Maru Gothic",sans-serif;
  --font-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--board-deep);color:var(--chalk);font-family:var(--font-body);font-weight:500;line-height:1.7;min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:28px 18px 48px;display:grid;gap:22px}
header h1{font-family:var(--font-display);font-weight:400;font-size:clamp(30px,9vw,44px);line-height:1.15;text-wrap:balance}
header h1 span{color:var(--yellow)}
header p{margin-top:10px;color:var(--chalk-dim);font-weight:700;font-size:15px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:2px dashed rgba(244,241,228,.3);padding-bottom:10px}
.count{font-family:var(--font-display);color:var(--yellow);font-size:18px}
label{font-size:13px;color:var(--chalk-dim);font-weight:700;display:flex;align-items:center;gap:8px}
select{font:inherit;font-weight:700;color:var(--chalk);background:var(--board);border:2px solid rgba(244,241,228,.4);border-radius:999px;padding:8px 14px;min-height:44px}
select:focus-visible,a.card:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
#list{display:grid;gap:14px;list-style:none}
a.card{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;background:var(--board);border:2px solid rgba(244,241,228,.28);border-radius:18px;padding:14px;color:inherit;text-decoration:none}
a.card:active{transform:translateY(2px)}
.thumb{width:96px;height:96px;border-radius:14px;background:var(--board-deep);display:grid;place-items:center;font-size:44px;position:relative}
.thumb.ring::before{content:"";width:58px;height:58px;border-radius:50%;border:6px solid var(--chalk);border-left-color:var(--yellow);transform:rotate(-18deg)}
.card h2{font-family:var(--font-display);font-weight:400;font-size:22px;line-height:1.3}
.card h2 em{font-style:normal;font-size:12px;background:var(--pink);color:#3a1620;border-radius:999px;padding:2px 9px;margin-left:8px;vertical-align:middle;font-family:var(--font-body);font-weight:700}
.card p{font-size:14px;color:var(--chalk-dim);font-weight:700;line-height:1.6;margin-top:2px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:12px;font-weight:700;align-items:center}
.tag{border:1.5px solid rgba(244,241,228,.4);border-radius:999px;padding:1px 9px}
.date{color:var(--chalk-dim);margin-left:auto;font-variant-numeric:tabular-nums}
footer{font-size:12px;color:var(--chalk-dim);text-align:center;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ロックポッポの<br><span>ゲーム置き場</span></h1>
    <p>ブラウザですぐ遊べる、ちいさなゲームを置いています。登録もインストールもいりません。</p>
  </header>
  <div class="bar">
    <div class="count" id="count"></div>
    <label for="sort">ならびかえ
      <select id="sort">
        <option value="new">新しい順</option>
        <option value="old">古い順</option>
      </select>
    </label>
  </div>
  <ul id="list"></ul>
  <footer>© 2026 ロックポッポ</footer>
</div>
<script>
/* ゲームを増やすときは、ここに1つ足すだけ */
const GAMES = [
  {
    path: 'marupon.html',
    title: 'まるかいてポン',
    text: '黒板にまるをかくと、なにかがうまれる。きれいなまるほど高いものが出る。10かいでいくらかせげる？',
    tags: ['ひとなで', '1分で遊べる', 'ずかん'],
    date: '2026-11-14',
    thumb: 'ring'
  }
];
const list = document.getElementById('list');
const sort = document.getElementById('sort');
function isNew(d) { return (Date.now() - new Date(d + 'T00:00:00+09:00').getTime()) < 14 * 86400000; }
function draw() {
  const games = GAMES.slice().sort((a, b) => sort.value === 'new' ? b.date.localeCompare(a.date) : a.date.localeCompare(b.date));
  list.textContent = '';
  for (const g of games) {
    const li = document.createElement('li');
    const a = document.createElement('a'); a.className = 'card'; a.href = g.path;
    const th = document.createElement('div'); th.className = 'thumb ' + (g.thumb === 'ring' ? 'ring' : '');
    if (g.thumb !== 'ring') th.textContent = g.thumb;
    const body = document.createElement('div');
    const h = document.createElement('h2'); h.textContent = g.title;
    if (isNew(g.date)) { const em = document.createElement('em'); em.textContent = 'NEW'; h.appendChild(em); }
    const p = document.createElement('p'); p.textContent = g.text;
    const meta = document.createElement('div'); meta.className = 'meta';
    for (const t of g.tags) { const s = document.createElement('span'); s.className = 'tag'; s.textContent = t; meta.appendChild(s); }
    const d = document.createElement('span'); d.className = 'date'; d.textContent = g.date.replace(/-/g, '.'); meta.appendChild(d);
    body.append(h, p, meta);
    a.append(th, body); li.appendChild(a); list.appendChild(li);
  }
  document.getElementById('count').textContent = games.length + '作品';
}
sort.addEventListener('change', draw);
draw();
</script>
</body>
</html>
